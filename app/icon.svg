<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="stentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background Container with Smooth Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Shield Pattern -->
  <path d="M256 64 L396 128 V272 C396 360 332 428 256 460 C180 428 116 360 116 272 V128 Z" 
        fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="3" stroke-opacity="0.3" />

  <!-- Stylized Kidney Silhouettes -->
  <!-- Left Kidney -->
  <path d="M190 190 C150 190 135 230 145 280 C155 330 190 350 220 330 C205 300 205 240 220 220 C210 195 200 190 190 190 Z" 
        fill="#38bdf8" fill-opacity="0.35" />
  
  <!-- Right Kidney -->
  <path d="M322 190 C362 190 377 230 367 280 C357 330 322 350 292 330 C307 300 307 240 292 220 C302 195 312 190 322 190 Z" 
        fill="#2dd4bf" fill-opacity="0.35" />

  <!-- Double-J Stent Helix Graphic (Double Loop J-Stent) with Golden Glow -->
  <!-- Top J-Loop (Renal Pelvis) -->
  <path d="M225 210 C210 160 280 150 295 190 C305 215 290 240 260 256" 
        fill="none" stroke="url(#stentGrad)" stroke-width="18" stroke-linecap="round" filter="url(#glow)" />

  <!-- Central Stent Shaft -->
  <path d="M260 256 L252 320" 
        fill="none" stroke="url(#stentGrad)" stroke-width="18" stroke-linecap="round" />

  <!-- Bottom J-Loop (Bladder Pigtail) -->
  <path d="M252 320 C235 365 295 385 305 340 C310 320 295 305 275 308" 
        fill="none" stroke="url(#stentGrad)" stroke-width="18" stroke-linecap="round" filter="url(#glow)" />

  <!-- Medical Cross Badge in Center Bottom -->
  <circle cx="256" cy="400" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
  <path d="M256 382 V418 M238 400 H274" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

  <!-- Small Glowing Pulsing Ring Indicator -->
  <circle cx="295" cy="190" r="8" fill="#fbbf24" />
  <circle cx="305" cy="340" r="8" fill="#34d399" />
</svg>
